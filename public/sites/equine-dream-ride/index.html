<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Equine Dream Ride — CHG Equestrians Midrand Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0c1310] text-stone-100 font-sans antialiased">
  <header class="border-b border-emerald-500/20 px-6 py-5 flex items-center justify-between max-w-6xl mx-auto">
    <div class="text-xl font-bold tracking-wider text-amber-300">CHG EQUESTRIANS // MIDRAND</div>
    <span class="text-xs bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 px-3 py-1 rounded-full">Supabase Booking Engine</span>

  <main class="max-w-6xl mx-auto px-6 py-12 space-y-10">

      <form id="eq-form" class="mt-8 grid md:grid-cols-4 gap-3">
        <input id="eq-name" required placeholder="Rider Name" class="rounded-xl bg-black/40 border border-white/15 px-4 py-3 text-sm" />
        <input id="eq-email" type="email" required placeholder="Email" class="rounded-xl bg-black/40 border border-white/15 px-4 py-3 text-sm" />
        <select id="eq-service" class="rounded-xl bg-black/60 border border-white/15 px-4 py-3 text-sm">

          <option value="Pro Jump & Dressage Assessment (R950)">Pro Jump & Dressage Assessment (R950)</option>
        </select>
        <button type="submit" class="rounded-xl bg-amber-400 text-stone-950 font-bold text-sm py-3">Book Session →</button>
      </form>
      <p id="eq-msg" class="text-xs text-emerald-400 mt-3 hidden">✓ Session booked in Supabase PostgreSQL (portfolio_bookings)!</p>
    </section>
  </main>

      document.getElementById('eq-msg').classList.remove('hidden');
